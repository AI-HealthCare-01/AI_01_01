name: aws-deploy-staging-draft

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  TF_WORKDIR: infra/aws/terraform/environments/staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      ROLE_ARN: ${{ secrets.AWS_GHA_ROLE_ARN_STAGING }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS auth configuration
        id: auth-config
        env:
          AWS_ACCESS_KEY_ID_STAGING: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY_STAGING: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "Using OIDC role authentication for staging."
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$AWS_ACCESS_KEY_ID_STAGING" ] && [ -n "$AWS_SECRET_ACCESS_KEY_STAGING" ]; then
            echo "Using static AWS credentials for staging."
            echo "auth_mode=static" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No AWS auth configuration found for staging. Skipping draft deploy."
          echo "auth_mode=none" >> "$GITHUB_OUTPUT"

      - name: Skip deploy when staging secrets are missing
        if: ${{ steps.auth-config.outputs.auth_mode == 'none' }}
        run: |
          echo "Staging AWS credentials are not configured."
          echo "Set AWS_GHA_ROLE_ARN_STAGING or both AWS_ACCESS_KEY_ID_STAGING and AWS_SECRET_ACCESS_KEY_STAGING to enable deploy."

      - name: Configure AWS credentials via OIDC
        if: ${{ steps.auth-config.outputs.auth_mode == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: github-actions-staging-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials via static keys
        if: ${{ steps.auth-config.outputs.auth_mode == 'static' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build and push web image
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        env:
          WEB_REPOSITORY_URI: ${{ secrets.ECR_WEB_REPOSITORY_URI_STAGING }}
        run: |
          docker build -f infra/aws/docker/web.Dockerfile -t "$WEB_REPOSITORY_URI:$IMAGE_TAG" .
          docker push "$WEB_REPOSITORY_URI:$IMAGE_TAG"

      - name: Build and push api image
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        env:
          API_REPOSITORY_URI: ${{ secrets.ECR_API_REPOSITORY_URI_STAGING }}
        run: |
          docker build -f infra/aws/docker/api.Dockerfile -t "$API_REPOSITORY_URI:$IMAGE_TAG" .
          docker push "$API_REPOSITORY_URI:$IMAGE_TAG"

      - name: Setup Terraform
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (draft backend)
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -backend=false

      - name: Terraform plan
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' }}
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD_STAGING }}
        run: |
          terraform plan \
            -var "web_image_uri=${{ secrets.ECR_WEB_REPOSITORY_URI_STAGING }}:${IMAGE_TAG}" \
            -var "api_image_uri=${{ secrets.ECR_API_REPOSITORY_URI_STAGING }}:${IMAGE_TAG}" \
            -out tfplan

      - name: Terraform apply
        if: ${{ steps.auth-config.outputs.auth_mode != 'none' && github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' }}
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD_STAGING }}
        run: |
          terraform apply -auto-approve \
            -var "web_image_uri=${{ secrets.ECR_WEB_REPOSITORY_URI_STAGING }}:${IMAGE_TAG}" \
            -var "api_image_uri=${{ secrets.ECR_API_REPOSITORY_URI_STAGING }}:${IMAGE_TAG}"
