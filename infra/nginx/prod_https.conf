upstream backend {
  server mindsight-api:8000;
}

upstream frontend {
  server mindsight-web:3000;
}

server {
  # 요청을 받을 도메인 or ip를 지정할 수 있습니다.
  server_name api.ozcodlngschool.com www.ozcodlngschool.com;

  # http 프로토콜의 포트로 요청 수신
  listen 80;

  # 추후 certbot ssl 인증서 생성 or 갱신 시 acme-challenge 경로
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # 요청을 받을 도메인 or ip를 지정할 수 있습니다.
  server_name api.ozcodlngschool.com;

  # https 프로토콜의 포트로 요청 수신
  listen 443 ssl;

  ssl_certificate /etc/letsencrypt/live/www.ozcodlngschool.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.ozcodlngschool.com/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location = /healthz {
    proxy_pass http://backend/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
  }

  location /v1/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
  }

  location / {
    return 404;
  }
}

server {
  # 요청을 받을 도메인 or ip를 지정할 수 있습니다.
  server_name www.ozcodlngschool.com;

  # http 프로토콜의 포트로 요청 수신
  listen 443 ssl;

  ssl_certificate /etc/letsencrypt/live/www.ozcodlngschool.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.ozcodlngschool.com/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
  }
}
