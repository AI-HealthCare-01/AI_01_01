[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsight-api"
version = "0.1.0"
description = "MindSight API scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "firebase-admin>=6.5.0,<7.0.0",
  "email-validator>=2.2.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "httpx>=0.27.0,<1.0",
  "ruff>=0.6.0,<1.0"
]
ml = [
  "joblib>=1.4.0,<2.0.0",
  "pandas>=2.2.0,<3.0.0",
  "scikit-learn>=1.5.0,<2.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
